name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/parapet.exe dist/Parapet.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Parapet-windows-x64
          path: dist/Parapet.exe

  macos:
    runs-on: macos-14 # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: sh scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Parapet-macOS-arm64
          path: dist/Parapet-macOS-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Parapet.exe
            artifacts/Parapet-macOS-arm64.zip
